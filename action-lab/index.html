<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色动作模拟器 · 富甲天下</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><span class="brand-icon">▷</span><span>角色动作模拟器<small>富甲天下 · 动作审核</small></span></a><div class="header-right"><span class="model">Seedance 2.5</span><button id="export">导出审核记录</button><a class="quiet" href="http://127.0.0.1:3577/" target="_blank">打开游戏 ↗</a></div></header>
<div class="layout"><aside class="sidebar"><div class="side-heading"><b>动作列表</b><span id="batch-count">首批 8 条</span></div><div id="progress"><i></i></div><p id="batch-state">正在读取生成进度…</p><div class="filters" id="filters"><button data-filter="all" class="active">全部</button><button data-filter="pending">待审</button><button data-filter="rework">重做</button><button data-filter="approved">通过</button></div><nav id="actions" aria-label="选择角色动作"></nav><div class="side-note">先看动作，再决定是否使用。<br>所有新片段初始均为待审核。</div></aside>
<main><section class="title-row"><div><div class="eyebrow" id="character">动作候选</div><h1 id="action-title">准备动作素材</h1><div class="meta" id="clip-meta">绿幕原片 → 去绿幕 → 逐帧预览</div></div><span class="decision-tag pending" id="decision-tag">待审核</span></section>
<div class="workspace"><section class="player-column"><div class="viewer-tabs" id="modes"><button class="active" data-mode="frames">去绿幕动作</button><button data-mode="video">绿幕原片</button><button data-mode="reference">角色参考</button><button data-mode="contact">分时画面</button></div><div class="stage checker" id="stage"><canvas id="preview" width="800" height="700" aria-label="角色动作预览"></canvas><video id="source-video" controls muted loop playsinline hidden></video><img id="reference" alt="角色身份参考" hidden><div id="contact" hidden></div><div class="empty" id="empty"><span class="spinner"></span><b id="empty-title">绿幕动作正在生成</b><p id="empty-detail">生成完成后会自动抽帧，并显示在这里。</p></div><div class="stage-badges"><span id="mode-label">透明动作预览</span><span id="frame-badge">— / —</span></div></div>
<div class="transport"><div class="scrub-row"><input id="scrub" type="range" min="0" max="0" value="0" aria-label="逐帧定位"><span id="time">0.00 / 0.00 秒</span></div><div class="play-controls"><div><button id="first" title="第一帧" aria-label="第一帧">|◁</button><button id="previous" title="上一帧 · ←" aria-label="上一帧">◁</button><button id="play" class="primary" aria-label="播放动作">播放</button><button id="next" title="下一帧 · →" aria-label="下一帧">▷</button><button id="last" title="最后一帧" aria-label="最后一帧">▷|</button></div><div class="play-options"><label><input id="loop" type="checkbox" checked>循环</label><label>速度 <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div></div></div>
<details class="trim" open><summary>循环范围 <small>可用逐帧按钮找到合适的起止点</small></summary><div><label>起始帧 <input id="trim-start" type="number" min="0" value="0"></label><button id="set-start">设为当前帧</button><label>结束帧 <input id="trim-end" type="number" min="0" value="0"></label><button id="set-end">设为当前帧</button><button id="reset-trim">恢复全段</button></div></details>
<div class="resources" id="resources"></div><p class="shortcuts">空格 播放/暂停　← → 逐帧　Home / End 跳到范围首尾</p></section>
<aside class="inspector"><section class="panel"><h2>观察设置</h2><label class="field">背景<select id="background"><option value="checker">透明网格</option><option value="light">米白</option><option value="dark">深色</option><option value="scene">游戏场景</option><option value="green">绿幕</option></select></label><label class="field">显示大小<select id="zoom"><option value="0.65">65%</option><option value="1" selected>100%</option><option value="1.35">135%</option><option value="1.7">170%</option></select></label><label class="check"><input type="checkbox" id="guides" checked>显示脚底线与中心线</label><label class="check"><input type="checkbox" id="mirror">左右镜像</label><label class="check"><input type="checkbox" id="ghost">叠加首帧检查衔接</label><label class="check"><input type="checkbox" id="travel">模拟行走位移</label></section>
<section class="panel review"><h2>这条动作怎么样？</h2><div class="decisions"><button data-decision="approved">✓ 通过</button><button data-decision="rework">↻ 需要重做</button><button data-decision="pending" class="active">稍后再审</button></div><label for="note">审核意见</label><textarea id="note" rows="5" placeholder="例如：脚步拖地、扫帚没贴地、手臂太僵、循环有停顿…"></textarea><div id="save-state" role="status">审核意见保存在本机</div></section>
<section class="panel qa"><h2>素材检查</h2><div id="qa"><p>生成完成后显示实际时长与抽帧信息。</p></div></section></aside></div></main></div><div id="toast" role="status"></div><script type="module" src="app.mjs"></script></body></html>
